name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Fetch mihomo cores
        run: scripts/fetch-cores.sh

      - name: Fetch dashboard
        run: scripts/fetch-dashboard.sh

      - name: Build Tun DNS helper
        run: scripts/build-dnshelper.sh

      - name: Vet and test
        run: |
          go vet ./...
          go tool mygo vet .
          go test ./...

      - name: Build universal app
        env:
          # Only tagged builds sign the update feed; nightlies stay unsigned.
          MYGO_UPDATER_PRIVATE_KEY: ${{ github.ref_type == 'tag' && secrets.MYGO_UPDATER_PRIVATE_KEY || '' }}
        run: go tool mygo build -platform darwin/universal

      # The release is universal; publish the same signed manifest under the
      # per-arch names too. Apps built with a single arch (e.g. a plain
      # `mygo build` on a developer machine) then find a feed and install
      # the universal archive instead of a 404.
      - name: Add per-arch update feeds
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cp build/darwin-universal/update-darwin-universal.json build/darwin-universal/update-darwin-amd64.json
          cp build/darwin-universal/update-darwin-universal.json build/darwin-universal/update-darwin-arm64.json

      - name: Upload app and disk image
        uses: actions/upload-artifact@v4
        with:
          name: clashx-go-darwin-universal
          path: build/darwin-universal/
          if-no-files-found: error

      # Publish a stable name that keeps the version: mygo embeds it in the
      # app bundle but names the disk image with the target arch as well.
      - name: Name disk image
        run: |
          version=$(python3 -c 'import json;print(json.load(open("mygo.json"))["version"])')
          echo "VERSION=$version" >> "$GITHUB_ENV"
          mkdir -p dist
          cp build/darwin-universal/*.dmg "dist/ClashX go ${version}.dmg"

      # The Nightly is a rolling release: drop every DMG it accumulated,
      # then let the publish step upload the current version's single one.
      - name: Clean old nightly DMGs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets=$(gh release view nightly --json assets --jq '.assets[].name' 2>/dev/null || true)
          printf '%s\n' "$assets" | while IFS= read -r name; do
            [ -n "$name" ] || continue
            case "$name" in
              *.dmg) gh release delete-asset nightly "$name" --yes || true ;;
            esac
          done

      - name: Publish nightly
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly
          prerelease: true
          # Never the "latest" release: the updater's feed ignores prereleases.
          make_latest: "false"
          body: |
            Automated build of `main` at ${{ github.sha }}.
          files: |
            dist/ClashX go *.dmg
            build/darwin-universal/*.tar.gz
            build/darwin-universal/*.zip
          fail_on_unmatched_files: false

      # The release page carries the curated notes from CHANGELOG.md: the
      # tag's ## <version> section, not GitHub's commit-generated notes.
      - name: Build release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(python3 -c 'import json;print(json.load(open("mygo.json"))["version"])')
          python3 - "$version" <<'PY'
          import re, sys
          version = sys.argv[1]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"^## {re.escape(version)}\s*$(.*?)(?=^## |\Z)", text, re.M | re.S)
          if not m:
              sys.exit(f"CHANGELOG.md has no ## {version} section")
          body = (
              f"ClashX go {version} 正式发布。\n\n"
              f"## 更新内容\n{m.group(1).strip()}\n\n"
              "---\n\n"
              f"下载 `ClashX go {version}.dmg` 安装。macOS 11+，"
              "Intel 与 Apple Silicon 通用。\n"
          )
          open("dist/release-notes.md", "w", encoding="utf-8").write(body)
          PY

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ClashX go ${{ env.VERSION }}
          body_path: dist/release-notes.md
          files: |
            dist/ClashX go *.dmg
            build/darwin-universal/*.tar.gz
            build/darwin-universal/*.zip
            build/darwin-universal/update-*.json
          fail_on_unmatched_files: false
