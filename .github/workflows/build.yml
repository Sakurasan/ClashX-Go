name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Fetch mihomo cores
        run: scripts/fetch-cores.sh

      - name: Fetch dashboard
        run: scripts/fetch-dashboard.sh

      - name: Build Tun DNS helper
        run: scripts/build-dnshelper.sh

      - name: Vet and test
        run: |
          go vet ./...
          go tool mygo vet .
          go test ./...

      - name: Stamp nightly version
        # The nightly must be a versioned prerelease the updater can find:
        # its feed picks the highest v-prefixed tag, and update.Compare
        # orders 0.2.18 < 0.2.19-nightly.<date> < 0.2.19, so bumping the
        # patch and suffixing -nightly.<UTC date> lands a nightly after the
        # current stable and before the next one. The rewrite stays in this
        # checkout; only the release carries it.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python3 - <<'PY'
          import datetime, json, pathlib
          p = pathlib.Path("mygo.json")
          c = json.loads(p.read_text(encoding="utf-8"))
          major, minor, patch = (int(x) for x in c["version"].split(".")[:3])
          c["version"] = f"{major}.{minor}.{patch + 1}-nightly.{datetime.datetime.now(datetime.UTC):%Y%m%d}"
          p.write_text(json.dumps(c, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          print("nightly version:", c["version"])
          PY

      - name: Build universal app
        env:
          # Every published build signs its update feed (nightlies too, so
          # the Nightly channel can install them); pull requests stay
          # unsigned.
          MYGO_UPDATER_PRIVATE_KEY: ${{ github.event_name != 'pull_request' && secrets.MYGO_UPDATER_PRIVATE_KEY || '' }}
        run: go tool mygo build -platform darwin/universal

      # The release is universal; publish the same signed manifest under the
      # per-arch names too. Apps built with a single arch (e.g. a plain
      # `mygo build` on a developer machine) then find a feed and install
      # the universal archive instead of a 404.
      - name: Add per-arch update feeds
        if: github.event_name != 'pull_request'
        run: |
          cp build/darwin-universal/update-darwin-universal.json build/darwin-universal/update-darwin-amd64.json
          cp build/darwin-universal/update-darwin-universal.json build/darwin-universal/update-darwin-arm64.json

      - name: Upload app and disk image
        uses: actions/upload-artifact@v4
        with:
          name: clashx-go-darwin-universal
          path: build/darwin-universal/
          if-no-files-found: error

      # Publish a stable name that keeps the version: mygo embeds it in the
      # app bundle but names the disk image with the target arch as well.
      - name: Name disk image
        run: |
          version=$(python3 -c 'import json;print(json.load(open("mygo.json"))["version"])')
          echo "VERSION=$version" >> "$GITHUB_ENV"
          mkdir -p dist
          cp build/darwin-universal/*.dmg "dist/ClashX Go ${version}.dmg"

      # Versioned nightlies replace the previous nightly release entirely:
      # the updater's prerelease feed resolves the highest v-prefixed tag,
      # and stale v*-nightly.* releases (or the old rolling `nightly` one)
      # would either shadow the newest build or just clutter the list.
      - name: Remove previous nightly releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tags=$(gh api repos/"$GITHUB_REPOSITORY"/releases --paginate --jq '.[].tag_name')
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            case "$tag" in
              v*-nightly.*|nightly) gh release delete "$tag" --yes --cleanup-tag || true ;;
            esac
          done <<EOF
          $tags
          EOF

      - name: Publish nightly
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Nightly ${{ env.VERSION }}
          prerelease: true
          # Never the "latest" release: the stable feed ignores prereleases.
          make_latest: "false"
          body: |
            Automated nightly build of `main` at ${{ github.sha }}.

            已通过「更新渠道: Nightly」自动更新安装；此页面供手动下载。
          files: |
            dist/ClashX Go *.dmg
            build/darwin-universal/*.tar.gz
            build/darwin-universal/*.zip
            build/darwin-universal/update-*.json
            build/darwin-universal/*.delta
          fail_on_unmatched_files: false

      # The release page carries the curated notes from CHANGELOG.md: the
      # tag's ## <version> section, not GitHub's commit-generated notes.
      - name: Build release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(python3 -c 'import json;print(json.load(open("mygo.json"))["version"])')
          python3 - "$version" <<'PY'
          import re, sys
          version = sys.argv[1]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"^## {re.escape(version)}\s*$(.*?)(?=^## |\Z)", text, re.M | re.S)
          if not m:
              sys.exit(f"CHANGELOG.md has no ## {version} section")
          body = (
              f"ClashX Go {version} 正式发布。\n\n"
              f"## 更新内容\n{m.group(1).strip()}\n\n"
              "---\n\n"
              f"下载 `ClashX Go {version}.dmg` 安装。macOS 11+，"
              "Intel 与 Apple Silicon 通用。\n"
          )
          open("dist/release-notes.md", "w", encoding="utf-8").write(body)
          PY

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ClashX Go ${{ env.VERSION }}
          body_path: dist/release-notes.md
          files: |
            dist/ClashX Go *.dmg
            build/darwin-universal/*.tar.gz
            build/darwin-universal/*.zip
            build/darwin-universal/update-*.json
            build/darwin-universal/*.delta
          fail_on_unmatched_files: false
